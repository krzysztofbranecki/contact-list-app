name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Must run AFTER setup-node so the shims land in the active Node's bin
      # dir — otherwise the runner's preinstalled Yarn 1 wins on PATH.
      - name: Enable Corepack (Yarn 4)
        run: corepack enable && yarn --version

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Dependency rules (dependency-cruiser)
        run: yarn deps:check

      - name: Generate Next.js route types
        run: yarn next typegen

      - name: Type check
        run: yarn tsc --noEmit

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
        env:
          # Dummy values — next build only needs these to exist; no connection
          # is opened at build time (all pages are server-rendered on demand).
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SESSION_SECRET: ci-only-secret-not-used-at-build-time-0000