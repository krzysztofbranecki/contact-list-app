version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all minor/patch bumps; majors stay separate.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Keep @types/node on the same major as the runtime (Vercel + .nvmrc
      # pin Node 24) — don't propose majors beyond it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint 10 removed context.getFilename(); eslint-plugin-react (via
      # eslint-config-next) still calls it and has no ESLint-10-compatible
      # release. Drop this once the plugin ecosystem catches up.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
# Touching this file forces an immediate Dependabot check.
